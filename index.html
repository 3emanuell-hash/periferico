<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo Periférico</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #202024;
            --text-color: #e1e1e6;
            --accent-color: #fba100;
            --accent-hover: #e09000;
            --border-color: #323238;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .menu-seccion {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #29292e;
            color: var(--text-color);
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent-color);
            color: #121214;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .resultado-tirada {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .carta-card {
            background: #29292e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 220px;
            padding: 12px;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .carta-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #121214;
        }

        .carta-card h3 {
            font-size: 15px;
            margin: 5px 0;
            color: var(--accent-color);
        }

        .carta-card p {
            font-size: 13px;
            color: #c4c4cc;
            text-align: left;
            margin: 5px 0;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Oráculo Periférico</h1>
        <p>Lectura y consulta de cartas</p>
    </header>

    <div class="container">
        <div class="menu-seccion">
            <label for="tipo-tirada">Seleccioná el tipo de tirada:</label>
            <select id="tipo-tirada">
                <option value="1">Carta Única (Mensaje del Día)</option>
                <option value="3">Pasado / Presente / Futuro (3 Cartas)</option>
                <option value="cruz">Cruz de Decisión (4 Cartas)</option>
                <option value="relacion">Lectura de Vínculo / Situación (2 Cartas)</option>
            </select>

            <button onclick="realizarTirada()">✨ Realizar Tirada</button>
        </div>

        <div id="contenedor-resultado" class="resultado-tirada">
            <!-- Aquí aparecen las cartas seleccionadas -->
        </div>
    </div>

    <script>
        // Mazo base integrado con las imágenes directas desde la carpeta /img del repositorio
        let mazoCartas = [
            {
                "id": "argentinazo",
                "title": "Argentinazo",
                "category": "6. Resistencias, luchas y referentes",
                "tag": "Memoria",
                "image": "img/argentinazo.png",
                "text": "La memoria colectiva como herramienta de transformación y resistencia frente al ajuste y la opresión sistémica."
            },
            {
                "id": "dormir",
                "title": "Dormir / Descanso",
                "category": "Cotidiano",
                "tag": "Salud",
                "image": "img/dormir.png",
                "text": "La necesidad imperiosa de frenar, recuperar energías y procesar la realidad sin culpa. El descanso como acto político."
            }
            // Podés agregar más cartas estructuradas de esta misma forma si lo deseas
        ];

        function mezclarMazo(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function realizarTirada() {
            const tipo = document.getElementById('tipo-tirada').value;
            const contenedor = document.getElementById('contenedor-resultado');
            contenedor.innerHTML = '';

            let mazoMezclado = [...mazoCartas];
            mezclarMazo(mazoMezclado);

            let cantidadACargar = 1;
            if (tipo === '3') cantidadACargar = 3;
            if (tipo === 'relacion') cantidadACargar = 2;
            if (tipo === 'cruz') cantidadACargar = 4;

            let seleccionadas = mazoMezclado.slice(0, cantidadACargar);

            seleccionadas.forEach((carta, index) => {
                let subtitulo = "";
                if (tipo === '3') {
                    subtitulo = index === 0 ? "Pasado" : (index === 1 ? "Presente" : "Futuro");
                } else if (tipo === 'relacion') {
                    subtitulo = index === 0 ? "Situación Actual" : "Energía de Cierre / Consejo";
                } else if (tipo === 'cruz') {
                    subtitulo = ["Situación", "Obstáculo", "Influencia", "Desenlace"][index];
                }

                const cardDiv = document.createElement('div');
                cardDiv.className = 'carta-card';
                cardDiv.innerHTML = `
                    <div>
                        ${subtitulo ? `<small style="color:var(--accent-color); font-weight:bold; display:block; margin-bottom:4px;">${subtitulo}</small>` : ''}
                        <img src="${carta.image}" alt="${carta.title}" onerror="this.src='https://via.placeholder.com/220x140?text=Imagen+No+Disponible'">
                        <h3>${carta.title}</h3>
                        <p>${carta.text}</p>
                    </div>
                `;
                contenedor.appendChild(cardDiv);
            });
        }
    </script>
</body>
</html>
